<!doctype html>
<html lang ="en">
<head>
    <link rel = "stylesheet" href="index.css">
</head>
<body>
    <!-- intro page components -->
    <h1 id = "introHeading"></h1>
    <h2 id = "introHeading2"></h2>
    <div class="centered">
        <button id = "introButton" onclick="promptParagraphNum()">I Survived</button>
    </div>

    <!-- number of paragraphs selection page components -->
    <h2 id = "numParagraphsHeading2" class = "hidden"></h2>
    <textarea id = "numParagraphsText" class = "hidden"></textarea>
    <div class = "centered"></div>
        <button id = "numParagraphsButton" class = "hidden" onclick="readInput()">Submit</button>
    </div>

    <!-- paragraphs page components -->
    <p id = "mainParagraph" class = "hidden"></p>
    <div class = "centered"></div>
        <button id = "nextButton" class = "hidden" onclick="increment()">Next</button>
        <button id = "finishButton" class = "hidden" onclick="startQuiz()">Finish</button>
    </div>

    <h2 id = "questionHeading" class = "hidden"></h2>
    <form id = "questions" class = "hidden">
        <input type="radio" name="choice" value="Scripting" id="option1"> Option 1
        <input type="radio" name="choice" value="Programming" id = "option2"> Option 2
        <input type="radio" name="choice" value="Application" id = "option3"> Option 3
        <input type="radio" name="choice" value="None of These" id = "option4"> Option 4
    </form>
    <button id = "submitButton" class = "hidden">Submit Answer</button>

    <script src = "index.js"></script>
</body>
</html>
